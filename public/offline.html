<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>You're Offline — HITECH</title>
<style>
  :root {
    --background: #0a0a0b;
    --foreground: #fafafa;
    --primary: #00a3ff;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: var(--background);
    background-image:
      radial-gradient(circle at 50% -20%, hsla(199, 100%, 50%, 0.14), transparent 65%),
      radial-gradient(circle at 100% 100%, hsla(262, 100%, 60%, 0.06), transparent 45%);
    color: var(--foreground);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 460px;
    width: 100%;
    text-align: center;
    padding: 48px 36px;
    border-radius: 32px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }
  .mark {
    width: 64px;
    height: 64px;
    margin: 0 auto 28px;
    border-radius: 18px;
    background: rgba(0, 163, 255, 0.1);
    border: 1px solid rgba(0, 163, 255, 0.25);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .mark svg { width: 28px; height: 28px; }
  h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0 0 12px;
  }
  p {
    font-size: 14px;
    line-height: 1.6;
    color: rgba(250, 250, 250, 0.5);
    font-weight: 300;
    margin: 0 0 32px;
  }
  button {
    appearance: none;
    border: none;
    cursor: pointer;
    background: var(--foreground);
    color: var(--background);
    font-weight: 700;
    font-size: 13px;
    padding: 14px 32px;
    border-radius: 999px;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  button:hover { opacity: 0.9; }
  button:active { transform: scale(0.97); }
  .brand {
    margin-top: 36px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: rgba(250, 250, 250, 0.2);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#00a3ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20h.01" />
        <path d="M8.5 16.5a5 5 0 0 1 7 0" />
        <path d="M5 13a10 10 0 0 1 14 0" />
        <path d="M2 8.82a15 15 0 0 1 20 0" />
        <line x1="2" y1="2" x2="22" y2="22" />
      </svg>
    </div>
    <h1>You're offline.</h1>
    <p>HITECH couldn't reach the network. Check your connection and try again — anything you'd already loaded is still cached.</p>
    <button onclick="window.location.reload()">Retry Connection</button>
    <div class="brand">HITECH Systems</div>
  </div>
</body>
</html>
